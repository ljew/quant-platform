<rect x="40" y="614" width="290" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="185" y="638" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">⑤ 券商柜台 · 验资验券 · 报备白名单</text>
<rect x="350" y="614" width="290" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="495" y="638" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">交易所撮合 · 成交回报</text>

<text x="40" y="682" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A">判据：候选池 / 参数是数据，可传；订单是指令，必须由终端自己生成 —— 删一只股票 ≠ 删一笔单</text>
