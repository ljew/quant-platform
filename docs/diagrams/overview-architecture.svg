<svg viewBox="0 0 680 700" width="680" height="700" xmlns="http://www.w3.org/2000/svg" role="img">
<title>整体技术架构图</title>
<desc>数据源、平台侧 L1-L7、人工摆渡、终端侧 QMT 沙箱、券商柜台与交易所五层分区</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="700" fill="#FFFFFF"/>

<text x="40" y="28" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">全自动交易系统 · 整体技术架构</text>
<text x="40" y="50" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#5F5E5A">平台侧负责「想清楚」，终端侧负责「下出去」，中间只有人工搬运（合规边界）</text>

<rect x="40" y="64" width="600" height="68" rx="10" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
<text x="56" y="84" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#0C447C">① 外部数据源 · 平台主动拉取，只读</text>
<rect x="56" y="92" width="180" height="32" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="146" y="108" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">Tushare 日线 · 复权因子</text>
<rect x="248" y="92" width="180" height="32" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="338" y="108" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">akshare 交易日历</text>
<rect x="440" y="92" width="180" height="32" rx="6" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.5"/>
<text x="530" y="108" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#185FA5" text-anchor="middle" dominant-baseline="central">券商 / 通达信 补充</text>

<path d="M340 132 L340 142" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="144" width="600" height="228" rx="12" fill="#EAF3DE" stroke="#97C459" stroke-width="0.5"/>
<text x="56" y="165" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#27500A">② 平台侧 quant-platform · Mac / Linux · 决策与对账（不碰下单）</text>

<rect x="56" y="176" width="180" height="54" rx="8" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
<text x="146" y="197" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle" dominant-baseline="central">L1 采集</text>
<text x="146" y="215" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">ETL · 19:00 增量抽取</text>
<rect x="248" y="176" width="180" height="54" rx="8" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
<text x="338" y="197" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle" dominant-baseline="central">L2 存储</text>
<text x="338" y="215" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">Parquet + SQLite + DuckDB</text>
<rect x="440" y="176" width="180" height="54" rx="8" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
<text x="530" y="197" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle" dominant-baseline="central">L3 计算</text>
<text x="530" y="215" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">14 因子 · 缠论信号</text>

<rect x="56" y="240" width="180" height="54" rx="8" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
<text x="146" y="261" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle" dominant-baseline="central">L4 决策</text>
<text x="146" y="279" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">单日纯函数 + 快照冻结</text>
<rect x="248" y="240" width="180" height="54" rx="8" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
<text x="338" y="261" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle" dominant-baseline="central">L5 风控</text>
<text x="338" y="279" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">单笔 / 组合 / 熔断</text>
<rect x="440" y="240" width="180" height="54" rx="8" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
<text x="530" y="261" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#27500A" text-anchor="middle" dominant-baseline="central">L6 对账</text>
<text x="530" y="279" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">滑点 · 成交率 · 漂移</text>

<rect x="56" y="304" width="564" height="48" rx="8" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
<text x="76" y="322" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#27500A" dominant-baseline="central">L7 服务 · 出口</text>
<text x="76" y="340" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11" dominant-baseline="central">REST API /api/v1/live · 看板 live.html · 企微告警 · 影子组合比对</text>

<path d="M340 372 L340 384" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="386" width="600" height="52" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="5 3"/>
<text x="56" y="406" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#791F1F">③ 人工摆渡 · 唯一通道 · 也是合规红线所在</text>
<text x="56" y="426" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#A32D2D">去程：目标持仓 / 参数（数据，允许）  回程：成交 CSV（结果，允许）  订单指令：禁止任何程序化传递</text>

<path d="M340 438 L340 450" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="450" width="600" height="150" rx="12" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
<text x="56" y="471" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="12" font-weight="500" fill="#412402">④ 终端侧 QMT · Windows · 封闭沙箱（禁文件读写 / 禁出站网络）</text>

<rect x="56" y="482" width="136" height="54" rx="8" fill="#FFFFFF" stroke="#854F0B" stroke-width="0.5"/>
<text x="124" y="503" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#412402" text-anchor="middle" dominant-baseline="central">行情接口</text>
<text x="124" y="521" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#854F0B" text-anchor="middle" dominant-baseline="central">QMT 原生取数</text>
<rect x="200" y="482" width="136" height="54" rx="8" fill="#FFFFFF" stroke="#854F0B" stroke-width="0.5"/>
<text x="268" y="503" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#412402" text-anchor="middle" dominant-baseline="central">缠论内核</text>
<text x="268" y="521" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#854F0B" text-anchor="middle" dominant-baseline="central">537 行 · 买点判定</text>
<rect x="344" y="482" width="136" height="54" rx="8" fill="#FFFFFF" stroke="#854F0B" stroke-width="0.5"/>
<text x="412" y="503" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#412402" text-anchor="middle" dominant-baseline="central">风控 gate</text>
<text x="412" y="521" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#854F0B" text-anchor="middle" dominant-baseline="central">guard.py 移植</text>
<rect x="488" y="482" width="136" height="54" rx="8" fill="#FFFFFF" stroke="#854F0B" stroke-width="0.5"/>
<text x="556" y="503" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#412402" text-anchor="middle" dominant-baseline="central">passorder</text>
<text x="556" y="521" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#854F0B" text-anchor="middle" dominant-baseline="central">11 参 · quickTrade=2</text>

<rect x="56" y="546" width="568" height="36" rx="8" fill="#FFFFFF" stroke="#854F0B" stroke-width="0.5"/>
<text x="76" y="564" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#854F0B" dominant-baseline="central">save_py_key · 券商服务端 KV（替代本地文件：streak 连续天数 / 候选池 / 幂等键 / 冷启动门控）</text>

