<svg xmlns="http://www.w3.org/2000/svg" width="680" height="528" viewBox="0 0 680 528"><rect width="680" height="528" fill="#FFFFFF"/><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="40" y="26" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="15" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">终端侧 · QMT 内部调用链</text><text x="40" y="46" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">Python 3.6.8 · 禁文件禁网络 · 状态只能存券商端 KV</text><text x="100" y="112" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">09:15</text><rect x="112" y="80" width="528" height="64" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="128" y="103" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="13" font-weight="500" fill="#412402" text-anchor="start" dominant-baseline="central">initialize · 读状态</text><text x="128" y="124" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#854F0B" text-anchor="start" dominant-baseline="central">get_py_key('streak') / ('gate') · 不能假设内存里有值，重启即丢</text><path d="M376 144 L376 154" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><text x="100" y="190" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">09:30</text><rect x="112" y="158" width="528" height="64" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/><text x="128" y="181" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">handlebar · 判时空转</text><text x="128" y="202" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">每根 bar 触发；非交易日或 now &lt; 14:45 立即 return —— 一整天都在这里空转</text><path d="M376 222 L376 232" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><text x="100" y="268" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">14:45</text><rect x="112" y="236" width="528" height="64" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="128" y="259" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="13" font-weight="500" fill="#412402" text-anchor="start" dominant-baseline="central">取数 + 缠论分解（主要工作量）</text><text x="128" y="280" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#854F0B" text-anchor="start" dominant-baseline="central">get_market_data_ex 5209 只 × 250 日 → 合并·分型·笔·线段·中枢·背驰 → 买点</text><path d="M376 300 L376 310" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><text x="100" y="346" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">14:47</text><rect x="112" y="314" width="528" height="64" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="128" y="337" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="13" font-weight="500" fill="#412402" text-anchor="start" dominant-baseline="central">候选 + 门控 + 风控</text><text x="128" y="358" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#854F0B" text-anchor="start" dominant-baseline="central">streak≤2 · close&lt;ma20 · 90 日超额&gt;0 · 单票 5% · 熔断 15%</text><path d="M376 378 L376 388" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#a)"/><text x="100" y="424" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="12" font-weight="500" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">14:52</text><rect x="112" y="392" width="528" height="64" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/><text x="128" y="415" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="13" font-weight="500" fill="#27500A" text-anchor="start" dominant-baseline="central">passorder + 写回状态</text><text x="128" y="436" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#3B6D11" text-anchor="start" dominant-baseline="central">限价单批量报出 · save_py_key 存当日命中名单与超额（单字段上限 5000 字符）</text><rect x="40" y="474" width="600" height="1" fill="#D3D1C7"/><text x="40" y="492" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">绿色框 = QMT 原生接口，直接调用；黄色框 = 要自己写，其中缠论 537 行是移植主体。</text><text x="40" y="512" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="12" font-weight="400" fill="#A32D2D" text-anchor="start" dominant-baseline="central">灰框那一整天空转不是设计缺陷 —— QMT 没有 run_daily，日频调度只能寄生在 handlebar 里。</text></svg>