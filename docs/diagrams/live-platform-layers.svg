="56" rx="8" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/><rect x="40" y="140" width="4" height="56" rx="2" fill="#3B6D11"/><text x="56" y="168" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">L2 存储</text><rect x="144" y="156" width="90" height="24" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/><text x="189" y="168" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#27500A" text-anchor="middle" dominant-baseline="central">SQLite 52 表</text><rect x="246" y="156" width="92" height="24" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/><text x="292" y="168" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#27500A" text-anchor="middle" dominant-baseline="central">DuckDB 分析库</text><rect x="350" y="156" width="88" height="24" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/><text x="394" y="168" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#27500A" text-anchor="middle" dominant-baseline="central">K线 990 万行</text><rect x="450" y="156" width="120" height="24" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/><text x="510" y="168" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#27500A" text-anchor="middle" dominant-baseline="central">signal_daily 17 万</text><rect x="40" y="204" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/><rect x="40" y="204" width="4" height="56" rx="2" fill="#3B6D11"/><text x="56" y="232" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">L3 计算</text><rect x="144" y="220" width="80" height="24" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/><text x="184" y="232" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#27500A" text-anchor="middle" dominant-baseline="central">ETL 19:00</text><rect x="236" y="220" width="102" height="24" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/><text x="287" y="232" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#27500A" text-anchor="middle" dominant-baseline="central">8 策略扫描 40s</text><rect x="350" y="220" width="92" height="24" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/><text x="396" y="232" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#27500A" text-anchor="middle" dominant-baseline="central">14 因子日更</text><rect x="454" y="220" width="116" height="24" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/><text x="512" y="232" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#27500A" text-anchor="middle" dominant-baseline="central">research_cards 档位</text><rect x="40" y="268" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/><rect x="40" y="268" width="4" height="56" rx="2" fill="#3B6D11"/><text x="56" y="296" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">L4 决策</text><rect x="144" y="284" width="108" height="24" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/><text x="198" y="296" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#27500A" text-anchor="middle" dominant-baseline="central">signals.py 快照</text><rect x="264" y="284" width="76" height="24" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/><text x="302" y="296" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#27500A" text-anchor="middle" dominant-baseline="central">target.py</text><rect x="352" y="284" width="74" height="24" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/><text x="389" y="296" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#27500A" text-anchor="middle" dominant-baseline="central">intent.py</text><rect x="438" y="284" width="132" height="24" rx="6" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/><text x="504" y="296" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#27500A" text-anchor="middle" dominant-baseline="central">decision_snapshot 冻结</text><rect x="40" y="332" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/><rect x="40" y="332" width="4" height="56" rx="2" fill="#185FA5"/><text x="56" y="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">L5 风控</text><rect x="144" y="348" width="72" height="24" rx="6" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="0.5"/><text x="180" y="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#042C53" text-anchor="middle" dominant-baseline="central">guard.py</text><rect x="228" y="348" width="78" height="24" rx="6" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="0.5"/><text x="267" y="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#042C53" text-anchor="middle" dominant-baseline="central">单笔 涨跌停</text><rect x="318" y="348" width="88" height="24" rx="6" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="0.5"/><text x="362" y="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#042C53" text-anchor="middle" dominant-baseline="central">组合 单票 5%</text><rect x="418" y="348" width="88" height="24" rx="6" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="0.5"/><text x="462" y="360" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#042C53" text-anchor="middle" dominant-baseline="central">熔断 回撤 15%</text><rect x="40" y="396" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/><rect x="40" y="396" width="4" height="56" rx="2" fill="#185FA5"/><text x="56" y="424" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">L6 对账</text><rect x="144" y="412" width="72" height="24" rx="6" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="0.5"/><text x="180" y="424" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#042C53" text-anchor="middle" dominant-baseline="central">recon.py</text><rect x="228" y="412" width="146" height="24" rx="6" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="0.5"/><text x="301" y="424" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#042C53" text-anchor="middle" dominant-baseline="central">fill → position 唯一入口</text><rect x="386" y="412" width="96" height="24" rx="6" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="0.5"/><text x="434" y="424" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#042C53" text-anchor="middle" dominant-baseline="central">滑点·成交率</text><rect x="494" y="412" width="104" height="24" rx="6" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="0.5"/><text x="546" y="424" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#042C53" text-anchor="middle" dominant-baseline="central">影子组合漂移</text><rect x="40" y="460" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/><rect x="40" y="460" width="4" height="56" rx="2" fill="#185FA5"/><text x="56" y="488" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">L7 服务</text><rect x="144" y="476" width="96" height="24" rx="6" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="0.5"/><text x="192" y="488" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#042C53" text-anchor="middle" dominant-baseline="central">live_daily.py</text><rect x="252" y="476" width="102" height="24" rx="6" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="0.5"/><text x="303" y="488" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#042C53" text-anchor="middle" dominant-baseline="central">FastAPI /live/*</text><rect x="366" y="476" width="76" height="24" rx="6" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="0.5"/><text x="404" y="488" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#042C53" text-anchor="middle" dominant-baseline="central">企微推送</text><rect x="454" y="476" width="118" height="24" rx="6" fill="#E6F1FB" stroke="#B5D4F4" stroke-width="0.5"/><text x="513" y="488" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="11" font-weight="400" fill="#042C53" text-anchor="middle" dominant-baseline="central">108 项测试 · 0 回归</text><rect x="40" y="534" width="600" height="1" fill="#D3D1C7"/><text x="40" y="552" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">纯函数边界：L4 的 target/intent 与 L5 的 guard 输入相同即输出相同，可对任意历史日重算。</text><text x="40" y="572" font-family="system-ui, -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="12" font-weight="400" fill="#444441" text-anchor="start" dominant-baseline="central">唯一写入口：live_position 只能由 recon.apply_fill() 写，其余全部只读 —— 这是对账可信的前提。</text></svg>