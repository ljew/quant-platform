<svg viewBox="0 0 680 682" width="680" height="682" xmlns="http://www.w3.org/2000/svg" role="img">
<title>数据流程图</title>
<desc>从收盘数据到下单成交再回流对账的一日闭环，标注每步落地的数据实体</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="682" fill="#FFFFFF"/>

<text x="40" y="28" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">数据流程图 · 一日闭环（T 日 17:00 → T+1 日 20:00）</text>
<text x="40" y="50" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="12" fill="#5F5E5A">绿=平台内程序化，红=人工搬运，琥珀=终端内程序化；右侧是每步真正落地的数据实体</text>
<text x="110" y="70" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" font-weight="500" fill="#5F5E5A" text-anchor="end">时刻</text>
<text x="132" y="70" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" font-weight="500" fill="#5F5E5A">处理环节</text>
<text x="640" y="70" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" font-weight="500" fill="#5F5E5A" text-anchor="end">落地实体</text>

<text x="110" y="106" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="end">17:00</text>
<rect x="124" y="84" width="372" height="46" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="140" y="102" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#27500A" dominant-baseline="central">交易所日线就绪</text>
<text x="140" y="119" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11" dominant-baseline="central">Tushare pro_bar 拉取当日 OHLCV + adj_factor（此前未就绪，ETL 故定 19:00）</text>
<path d="M496 107 L506 107" fill="none" stroke="#888780" stroke-width="1"/>
<rect x="508" y="87" width="132" height="40" rx="6" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
<text x="574" y="107" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">原始日线</text>

<path d="M310 130 L310 140" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="110" y="164" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="end">19:00</text>
<rect x="124" y="142" width="372" height="46" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="140" y="160" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#27500A" dominant-baseline="central">ETL 增量抽取</text>
<text x="140" y="177" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11" dominant-baseline="central">daemon 线程调度（沙箱无 cron），subprocess 隔离、崩溃不影响主进程</text>
<path d="M496 165 L506 165" fill="none" stroke="#888780" stroke-width="1"/>
<rect x="508" y="145" width="132" height="40" rx="6" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
<text x="574" y="165" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">Bronze Parquet</text>

<path d="M310 188 L310 198" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="110" y="222" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="end">19:05</text>
<rect x="124" y="200" width="372" height="46" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="140" y="218" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#27500A" dominant-baseline="central">清洗 · 复权 · 过滤</text>
<text x="140" y="235" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11" dominant-baseline="central">停牌 / ST / 次新剔除；close_raw 与 close_adj 双份都要留</text>
<path d="M496 223 L506 223" fill="none" stroke="#888780" stroke-width="1"/>
<rect x="508" y="203" width="132" height="40" rx="6" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
<text x="574" y="223" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">Silver 清洗层</text>

<path d="M310 246 L310 256" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="110" y="280" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="end">19:15</text>
<rect x="124" y="258" width="372" height="46" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="140" y="276" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#27500A" dominant-baseline="central">因子 · 缠论信号</text>
<text x="140" y="293" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11" dominant-baseline="central">14 因子写入 + 5209 只全市场缠论分解（合并→分型→笔→线段→中枢→背驰）</text>
<path d="M496 281 L506 281" fill="none" stroke="#888780" stroke-width="1"/>
<rect x="508" y="261" width="132" height="40" rx="6" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
<text x="574" y="281" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">signal_daily</text>

<path d="M310 304 L310 314" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="110" y="338" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="end">19:30</text>
<rect x="124" y="316" width="372" height="46" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="140" y="334" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#27500A" dominant-baseline="central">单日决策</text>
<text x="140" y="351" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11" dominant-baseline="central">decide_close → apply_open → mark，纯函数 + 快照冻结，可重演比对</text>
<path d="M496 339 L506 339" fill="none" stroke="#888780" stroke-width="1"/>
<rect x="508" y="319" width="132" height="40" rx="6" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
<text x="574" y="339" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">decision_snapshot</text>

<path d="M310 362 L310 372" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="110" y="396" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="end">19:35</text>
<rect x="124" y="374" width="372" height="46" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="140" y="392" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#27500A" dominant-baseline="central">风控 + 生成意图</text>
<text x="140" y="409" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11" dominant-baseline="central">单笔 5% / 组合 60% / 熔断；intent = target − actual，幂等键去重</text>
<path d="M496 397 L506 397" fill="none" stroke="#888780" stroke-width="1"/>
<rect x="508" y="377" width="132" height="40" rx="6" fill="#FFFFFF" stroke="#3B6D11" stroke-width="0.5"/>
<text x="574" y="397" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">order_intent</text>

<path d="M310 420 L310 430" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="110" y="454" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="end">T+1 08:50</text>
<rect x="124" y="432" width="372" height="46" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="5 3"/>
