<text x="40" y="668" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A">单向事实源：仓位只由 apply_fill 改写；决策只从快照读；任何一步可重演，重演结果必须等于当日结果</text>
