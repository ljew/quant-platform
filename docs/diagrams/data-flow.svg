<text x="140" y="467" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#A32D2D" dominant-baseline="central">平台导出目标持仓 / 参数 → 人工拷进 QMT 机器（数据可传，指令不可传）</text>
<path d="M496 455 L506 455" fill="none" stroke="#888780" stroke-width="1"/>
<rect x="508" y="435" width="132" height="40" rx="6" fill="#FFFFFF" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="574" y="455" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#791F1F" text-anchor="middle" dominant-baseline="central">target.csv</text>

<path d="M310 478 L310 488" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="110" y="512" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="end">T+1 14:50</text>
<rect x="124" y="490" width="372" height="46" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="140" y="508" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#412402" dominant-baseline="central">QMT 内闭环 · 下单</text>
<text x="140" y="525" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#854F0B" dominant-baseline="central">handlebar 判时间 → 内置取数 → 缠论 → gate → passorder（11 参，quickTrade=2）</text>
<path d="M496 513 L506 513" fill="none" stroke="#888780" stroke-width="1"/>
<rect x="508" y="493" width="132" height="40" rx="6" fill="#FFFFFF" stroke="#854F0B" stroke-width="0.5"/>
