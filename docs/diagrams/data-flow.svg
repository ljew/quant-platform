<path d="M310 536 L310 546" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="110" y="570" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#5F5E5A" text-anchor="end">T+1 15:30</text>
<rect x="124" y="548" width="372" height="46" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="5 3"/>
<text x="140" y="566" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="13" font-weight="500" fill="#791F1F" dominant-baseline="central">人工导出成交 · 回程</text>
<text x="140" y="583" font-family="system-ui, -apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#A32D2D" dominant-baseline="central">QMT 成交记录导 CSV → 平台导入，apply_fill 是 live_position 唯一写入口</text>
<path d="M496 571 L506 571" fill="none" stroke="#888780" stroke-width="1"/>
