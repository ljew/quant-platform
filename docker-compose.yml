# 个人量化投研平台 — 一键部署（设计 v1.0）
# 用法：cp .env.example .env（填 QUANT_TUSHARE_TOKEN）&& docker compose up -d --build
# 访问：http://localhost:8000 （后端 FastAPI 直接托管前端页面 + /api）
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 预留：完整版任务队列 Celery broker（当前后端用轻量线程池，未依赖 redis 也能跑）
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      - QUANT_DATABASE_URL=sqlite:////data/quant_dev.db
      - QUANT_FRONTEND_DIR=/frontend
      - QUANT_TUSHARE_TOKEN=${QUANT_TUSHARE_TOKEN:-}
      - QUANT_DEBUG=false
    volumes:
      - quant_data:/data
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  quant_data:
