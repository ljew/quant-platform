# 个人量化投研平台 — 一键部署（设计 v1.0）
# 用法：docker compose up -d --build
# 访问：http://localhost:8000 （后端托管 React 构建产物 + /api）
# 数据：./data 目录 bind 挂载（复用本机 SQLite/DuckDB，容器内外一致）
# 调度：QUANT_DATA_SCHEDULE=1 → 每交易日 19:00 ETL 自动增量 + 因子落库 + 断供自愈 + 成分月度刷新
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 预留：完整版任务队列 Celery broker（当前后端用轻量线程池，未依赖 redis 也能跑）
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped        # 容器级常驻：崩溃自动重启 + 开机自启
    environment:
      - QUANT_DATABASE_URL=sqlite:////data/quant_dev.db
      - QUANT_FRONTEND_DIR=/frontend
      - QUANT_TUSHARE_TOKEN=${QUANT_TUSHARE_TOKEN:-}
      - QUANT_DATA_SCHEDULE=1       # ETL 每晚 19:00 自动增量 + 因子落库 + 断供自愈 + 成分月度刷新
      - QUANT_DEBUG=false
      - QUANT_SOURCES_YAML=/app/config/sources.yaml
    volumes:
      - ./data:/data                # bind 挂载本机数据（复用现有 SQLite/DuckDB）
      - ./config:/app/config        # 数据源配置（改 sources.yaml 无需重建镜像）
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
