# 个人量化投研平台 — 一键部署（2026-11-02 Docker 常驻化）
#
# 用法：
#   docker compose up -d --build       # 首次构建并启动
#   docker compose logs -f backend     # 看日志
#   docker compose restart backend     # 重启
#
# 访问：http://localhost:8000 （后端托管 React 构建产物 + /api）
#
# ⚠️ 与宿主机 uvicorn 二选一
#   ./data 是 bind 挂载，容器与本机 uvicorn 会**同时写** quant_dev.db → 损坏
#   （2026-09-10 事故：file is not a database）。切到 Docker 前必须：
#     launchctl bootout gui/$(id -u)/com.quant.backend
#   否则 launchd 的 StartInterval 巡检会把宿主进程再拉起来，形成双写。
services:
  # redis 预留（完整版任务队列 Celery broker）—— 当前后端用轻量线程池，代码里无任何
  # redis 引用。常驻一个没人用的容器只会污染 `docker ps`、占 6379；需要时取消注释即可。
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"

  # 公众号采集：**不引入额外容器**。
  # 2026-11-02 评估过 we-mp-rss（WeRSS），最终没采用：它的公众号后台渠道已被微信封
  # （2026-07-30），读书渠道与 wewe-rss 同源；而读书官方接口本身可以直连
  # （/api/mp/cover + /web/mp/content），只需一份 Cookie。
  # 采集就跑在 backend 容器内：backend/scripts/wechat/collect_weread.py
  # （每日 08:20 / 20:40 由 wechat_scheduler 触发，页面上也能手动「立即采集」）。

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: quant-backend
    # 常驻：容器异常退出/机器重启后自动拉起（单写者，不再有双写风险）
    restart: unless-stopped
    # 内存上限：Docker Desktop 的 VM 只有 7.75GiB。不设限时，批量抓取公众号
    # （文章页 3.4MB/篇 + 400MB 库的 page cache）会把整个 VM 顶爆，
    # 内核可能在 VM 里随机挑进程杀 —— 2026-11-02 实测 OOMKilled=true。
    # 加了限之后超限只 OOM 本容器，再由 restart 策略拉起，爆炸半径限制在自己身上。
    mem_limit: 5500m
    memswap_limit: 5500m
    environment:
      - QUANT_DATABASE_URL=sqlite:////data/quant_dev.db
      - QUANT_FRONTEND_DIR=/frontend
      - QUANT_TUSHARE_TOKEN=${QUANT_TUSHARE_TOKEN:-}
      - QUANT_DATA_SCHEDULE=1
      # 每晚 20:05 自动验证的策略（逗号分隔）。jk001r 是聚宽 R 版移植，
      # 与 jk001 分开留档，便于对比「等权 vs 名次加权」的指标漂移。
      - QUANT_VERIFY_STRATEGIES=jk001,jk001r
      - QUANT_DEBUG=false
      - QUANT_SOURCES_YAML=/app/config/sources.yaml
      # 公众号全文库：代码在 /app/data 是空目录，真实数据挂在 /data（bind mount），
      # 必须显式指向，否则 /wechat 页面会报「未找到 knowledge.db」
      - QUANT_WECHAT_DATA_DIR=/data/wechat
      # 时区：所有定时任务（17:30 编排 / 19:00 ETL / 20:47 挖矿）按北京时间触发
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/data                # 复用现有 SQLite/DuckDB
      - ./config:/app/config        # 数据源配置（改 sources.yaml 无需重建镜像）
      # 代码热挂载（2026-11-02 加入）：集成新策略时避免每次 docker compose build。
      # 代价是改代码即时生效、没有 review 环节 —— 语法错误会让容器起不来，
      # 出问题改回宿主机文件即可恢复，不必重建镜像。
      - ./backend/app:/app/app
      # ⚠️ scripts 也必须挂载：verify_strategy / etl_daily / 公众号采集都在这里。
      # 2026-11-06 发现只挂 app 的后果——宿主机改过的 collect_weread.py（凭证失效
      # 快速退出）和 verify_strategy.py 都没进容器，跑的一直是镜像里的旧版本，
      # 「改了没生效」排查了半天。挂上之后改脚本只需 restart，不必 rebuild。
      - ./backend/scripts:/app/scripts
      # 前端产物也挂进来：改完 `cd web && npm run build` 只需 restart，
      # 不必重建镜像（原来 dist 烤在镜像里，每次改 UI 都要 build 一遍）。
      - ./web/dist:/frontend:ro
    ports:
      # ⚠️ 只绑本机回环（2026-11-06 安全加固）：服务无鉴权，原 "8000:8000"
      # 会让局域网任何设备读写数据、触发回测、改邮件/LLM 凭据。
      # 需要手机或别的机器访问时：改成 "8000:8000"，或走 SSH 隧道 / Tailscale。
      - "127.0.0.1:8000:8000"
    healthcheck:
      # 用 /openapi.json 而非 /health：后者会调 check_akshare()（联网校验），
      # 可能拖到超时，造成容器被反复判死。
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=5); sys.exit(0)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 90s            # 启动要载入 DuckDB/初始化表，给足 90 秒
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
