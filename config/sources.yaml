# 数据源配置（声明式）—— datahub 按此驱动抽取管道
# type: 提取器类型；step: 该源对应的管道步骤；layer: 产出落入的层
# enabled: 关闭后 pipeline 跳过该源

sources:
  core_index_kline:
    type: index_kline_tushare
    step: extract_index_kline
    layer: bronze
    produces: market/bars_daily（指数）
    enabled: true
    description: 8 核心指数日K（增量）
    params:
      symbols: [sh000906, sh000300, sh000905, sh000852, sh000001, sz399001, sz399006, sh000016]

  stock_kline_core:
    type: stock_kline_tushare
    step: extract_stock_kline
    layer: bronze
    produces: market/bars_daily（个股）+ kline_daily
    enabled: true
    description: 核心池个股前复权日K（增量）
    params:
      pool: core          # core=核心指数成分并集；或直接列 symbols
      lookback_days: 30

  stock_attributes:
    type: attributes_tushare
    step: extract_attributes
    layer: gold
    produces: stocks（截面属性）
    enabled: true
    description: 全市场截面属性（daily_basic）

  eastmoney_announcements:
    type: eastmoney_announcements
    step: extract_announcements
    layer: bronze
    produces: text/announcements + 个股情绪（codes 精确关联）
    enabled: true
    description: 上市公司公告（全市场，事件性强）
    params:
      pages: 5
      page_size: 100

  wechat_articles:
    type: wechat_articles_sqlite
    step: extract_wechat_articles
    layer: bronze
    produces: text/wechat_articles + text/articles_cleaned
    enabled: true
    description: 公众号财经语料（文本管道输入）
    params:
      # 留空 = 自动跟随 settings.wechat_data_dir（容器 /data/wechat、本机 data/wechat）。
      # 2026-11-07 之前这里写死旧 Xiaoan 项目路径，容器内不存在 → step 静默 return 0，
      # 公众号语料从未进入情绪管道。显式填路径仍优先。
      db_path: ""
      body_chars: 4000

  tushare_news:
    type: tushare_news
    step: extract_tushare_news
    layer: bronze
    produces: text/tushare_news
    enabled: true
    description: tushare 资讯（major_news 深度新闻 + cctv_news 新闻联播）
    params:
      # pro.news(src=...) 各源实测 0 行（权限不够），只接这两个能用的接口。
      # major_news 只有标题、没有正文，打分时只跑标题；cctv_news 有正文。
      days: 3
      major_rows: 500

  social_heat:
    type: social_heat
    step: extract_social_heat
    layer: bronze
    produces: text/social_heat
    enabled: true
    description: 雪球 A 股热股 + 微博热搜（关注度，不含多空情绪）
    params:
      xq_size: 50          # 雪球 A 股热股榜条数（type=12）
      weibo_size: 60       # 微博热搜条数（免登录接口约 52 条）

  eastmoney_news:
    type: eastmoney_news
    step: extract_eastmoney_news
    layer: bronze
    produces: text/eastmoney_news + 市场/个股情绪
    enabled: true
    description: 东财全市场新闻流（财联社/券商中国等，含当日）
    params:
      pages: 20
      page_size: 100
