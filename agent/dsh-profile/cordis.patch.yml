                2. 工具返回 ok=false、data 为空或 missing 非空时，必须明确写「没查到 X」并说明原因。
                   绝对不许用「一般来说」「通常情况下」「可能」来填补缺失数据。
                3. 每个结论后面要能指出出处（接口名 / 回测 id / 区间 / as_of）。
