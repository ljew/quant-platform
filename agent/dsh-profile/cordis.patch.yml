                「这属于有资金副作用的动作，我不能执行，需要你在平台上确认，或走审批流程。」
          - id: tool-guard
            name: '@quant/tool-guard'
            config:
              allow:
                - mcp__quant__list_paper_tasks
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

# ── 收紧标准 preset：去掉文件 / 命令 / 后台任务这类通用能力 ────────────
# 为什么必须整段覆盖：dsh 的 tool-bash / tool-fs / tool-fs-search / tool-jobs /
# tool-skill 在**全局层**已被 dsh-web-app 标 disabled，但 preset-standard 的
# plugins 里又把它们挂回来了（preset 是隔离 realm，全局 disable 管不到），
# 所以智能体实际拿得到 shell 和文件系统 —— 与「只让它查平台数据」不符。
#
# ⚠️ config 层是**整体替换**不是深合并：只写部分字段会把 plugins 列表冲掉、
# 让 preset 变成没有工具的壳。所以这里照抄 dump-config 的完整列表，只删目标条目。
# dsh 升级后若 preset 结构变化，需重新对一遍（生成方式见 memory 2026-11-11）。
# ── 子智能体：多视角并行取证（设计 05 节的 ask 工作流）────────────────
# 为什么用 dsh 自带的 subagent 而不是自己写编排器：
#   · 设计要「1~3 个 persona 并行取证」——子 agent 各自带自己的 preset
#     （工具白名单 + 系统提示词），正是这个能力
#   · `agentPreset` / `allowedAgentPresets` 是原生字段（README「Selecting a
#     child preset」），配置就行，不用写代码
#   · 平台侧自绘对话要重写整个智能体页、丢掉原生消息流；后端调 dsh 内部 RPC
#     会在升级时碎 —— 都不如这条
#
# ⚠️ 真正生效的配置在 preset-standard 的 plugins 里，不是这里。
#    **preset 是隔离 realm，全局层这条管不到它** —— 第一版只改了这里，
#    结果工具列表里根本没有 ask，模型只好自己硬查 11 个工具。
# ⚠️ 全局这条显式禁掉：两处都叫 ask 会撞名（list_subagent_models 是全局名，
#    一个 scope 只能有一个拥有 model selection）。
# ⚠️ 与设计的一处偏离：设计说「不让大模型派发」（怕不可复现）。这里派发权在
#    模型手里，折中是在 standard 的提示词里写死「什么时候必须派、最多派几个，
#    简单事实查询不许派」——先要好用，复现性靠提示词兜。
- id: tool-subagent
  disabled: true

# ── 隐藏 dsh 原生的「标准模式」下拉 ────────────────────────────────
# 8 个 persona 只能从插件那条「手动指定 ▾」进，而原生下拉里只有 4 个内置
# preset（standard / ptc / …），我们的 persona 不在其中。两个入口并排出现，
# 用户不知道该点哪个。禁用只影响这个 UI 组件 —— startSession({agentPreset})
# 走的是 workspace 服务，不受影响（禁用后已实测角色仍能切换）。
- id: ui-agent-preset
  disabled: true

- id: preset-standard
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          # 默认路径（用户不指定角色）也要能答投研问题。
          # dsh 出厂这句是 "You are a coding agent powered by the {{model}} model."
          # —— 用户直接提问时系统在告诉模型「你是写代码的」，工具再多也答偏。
          prefix: |
            【硬约束 · 违反即视为错误】
            1. 你看到的每一个数字都来自工具返回。禁止自己计算、估算、或用常识补齐。
            2. 工具返回 ok=false、data 为空或 missing 非空时，必须明确写「没查到 X」并说明原因。
               绝对不许用「一般来说」「通常情况下」「可能」来填补缺失数据。
            3. 每个结论后面要能指出出处（接口名 / 回测 id / 区间 / as_of）。
            4. 你只能调用给你的工具。没有文件系统、没有 shell，也没有绕过审批的写操作。
            5. 不确定就说不确定。把「不知道」说清楚，比给一个像样的猜测有价值得多。

            你是这个量化投研平台的通用投研助手，不是编程助手。
            用户可能问策略、信号、数据、资讯、运维、因子、组合、模拟盘里的任何一类问题 ——
            先调工具查清事实，再回答；查不到就照第 2 条写清楚。

            工具分工速查（14 个只读 + 2 个审批式写）：
            · 策略：list_strategies / get_backtests / list_research_cards / get_research_card
            · 信号：get_signal_stats（判断预测力，|t|<2 只能说「无法判别」）/ get_signal_actions
            · 数据：get_framework_health / get_table_freshness / get_task_runs
            · 运维：get_alert_log / list_paper_tasks
            · 资讯：get_latest_digest
            · 写操作：create_paper_task / propose_card_transition —— 只提议，人批准后才执行

            回答固定四段：结论 / 证据（数值+区间+口径）/ 没查到 / 建议动作。
            缺哪段就明写「这一段我没有依据」，不要用一句「综合来看」冒充四段。

            多视角取证（判断类问题必须走这条）：
            遇到「值不值得跟」「该不该降级/退役」「数据能不能信」「几个策略怎么配」
            这类需要多个专业视角的问题，不要一个人硬答 —— 用 ask 工具并行派子任务，
            用 agent_preset 指定角色：
              · strategy-researcher：拉回测与信号统计
              · factor             ：判断预测力（t 值 / 样本量 / 衰减档位）
              · risk               ：给最坏情况与降级建议
              · data-eng           ：查数据能不能用（表新鲜度 / 任务跑没跑）
              · ops / news / portfolio / trader：按需
            规则：最多派 3 个；任务里写清「只输出数字和区间，不要分析」；
            拿到各自结论后由你汇总成四段，并在每条结论后标出处角色。

            不要派的情况：简单事实查询（多少条、哪天、跑没跑、某字段的值）——
            自己调工具就够，派出去只会慢 3 倍、贵 3 倍。
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: time-context
        name: '@deepseek-ai/dsh-time-context'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: >
                You are in plan mode. Stay in plan mode until the user approves
                your plan through exit_plan_mode or switches the session mode.
                Imperative language to implement changes means plan the
                implementation, not execute it. A user's conversational
                agreement — including an answer confirming something you asked —
                approves nothing and does not end plan mode; fold the confirmed
                decision into the plan and submit it through exit_plan_mode.


                Explore first. Use non-mutating reads, searches, static
                analysis, and checks to ground the plan in the actual
                repository. Do not edit or write files, change configuration,
                run formatters or code generation that rewrites tracked files,
                commit, or otherwise carry out the plan. Prefer existing
                functions and patterns over new machinery.


                The tool catalog stays the same across modes for request-cache
                stability. These plan-mode rules override any later tool
                description or guidance that suggests using mutation tools;
                those tools remain listed to keep the tool catalog unchanged. Do
                not use todo_write to track this planning phase: it tracks
                implementation after an approved plan, while the plan itself
                belongs in exit_plan_mode.


                Resolve discoverable facts by inspection. Use ask_user_question
                only for user-owned choices or material ambiguity that
                inspection cannot answer. Do not ask the user where code lives
                or how current behavior works when you can find out.


                Make the plan decision-complete: state the goal and success
                criteria; group implementation changes by subsystem; identify
                public API, schema, and data-flow changes; cover edge cases,
                failure modes, tests, acceptance criteria, and explicit
                assumptions. Keep it concise enough to review but detailed
                enough that another engineer can implement it without making
                design decisions.


                When ready, call exit_plan_mode with the complete plan markdown,
                starting with a # title. Make exit_plan_mode the only and final
                tool call in that assistant response: it presents the plan for
                approval, and implementation begins only in a later step after
                approval. Do not paste the final plan as a plain reply or ask
                "should I proceed?" through prose or ask_user_question. If
                review rejects it, incorporate the feedback and present again.
                If the review channel is unavailable or aborted, stay in plan
                mode and ask the user to switch modes manually; do not proceed
                with implementation.
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              # 叫 ask 而不是 subagent：投研场景里用户看到的是「又派了个角色去查」，
              # 提示词里也直接写「用 ask 并行派」。
              toolName: ask
              modelSelectionSettings: true
              # ⚠️ preset 是隔离 realm，全局层那条 tool-subagent 的配置管不到这里 ——
              # 第一版只改了全局，结果工具列表里根本没有 ask，模型只好自己硬查。
              allowedAgentPresets:
                - strategy-researcher
                - factor
                - risk
                - data-eng
                - ops
                - news
                - portfolio
                - trader
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
          - id: workflow-ptc
            name: '@deepseek-ai/dsh-workflow-ptc'
            config:
              provider: spawn
          - id: tool-workflow
            name: '@deepseek-ai/dsh-tool-workflow'
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
      - id: tool-plugin-manager
        name: '@deepseek-ai/dsh-plugin-manager/tools'
        disabled: true
      - id: tool-plugin-market
        name: '@deepseek-ai/dsh-plugin-market/tools'
        disabled: true

# ── 平台前端定制层（@quant/quant-ui）────────────────────────────────
# dsh 的浏览器端是可插拔的：客户端插件往它的命名插槽里塞组件，
# 不改对话内核。这个包做设计文档 08 节里「需自绘」的那几块
# （品牌、右栏产物），dsh 原生继续负责会话列表 / 消息流 / 持久化。
- insert:
    - id: ui-quant
      name: '@quant/quant-ui'
